minimumNVDAVersion = 2025.1
lastTestedNVDAVersion = 2026.2
docFileName = readme.html
changelog = """* Selecting an item with **Control+Space**, such as a file in File Explorer, now says "selected", as NVDA does. With **List item state reporting** on its default, **Say not selected**, ClassicSpeech said only the file's name. Unselecting a file still says "not selected".
* **List item state reporting** now decides only what you hear as you move to items. When you select or unselect the item you're on, you always hear which it became, whatever the option says.
* Selecting an item that has no name used to be silent. It now says "selected"."""
