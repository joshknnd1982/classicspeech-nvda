docFileName = readme.html
changelog = """* In Microsoft Outlook's message list, an unread message starts with "unread" again as you move to it, as it does in NVDA without ClassicSpeech. With ClassicSpeech, NVDA read the message without it, and said "unread" only when it read the whole message a second time, which you seldom heard because you had already moved on.
* The same goes for everything else NVDA gets from Outlook about a message: "replied", "replied all", "forwarded", "has attachment", "high importance", "low importance" and "meeting request".
* NVDA no longer reads a message a second time just to add "unread"."""
