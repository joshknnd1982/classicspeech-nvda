docFileName = readme.html
changelog = """* In File Explorer's list of files, **Control+Space** now says it the way JAWS does. When you unselect a file, you hear "not selected" first and then the file's name. When you select a file, you hear just "selected". ClassicSpeech used to say the file's name first, as it does when you move to a file, so "not selected" was easy to miss.
* Everywhere else, such as a list in another program, an Open dialog or File Explorer's navigation pane, you still hear the item's name and then "selected" or "not selected".
* What you hear as you move from file to file hasn't changed, and still follows **List item state reporting**."""
